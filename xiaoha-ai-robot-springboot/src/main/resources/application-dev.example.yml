spring:
  datasource:
    driver-class-name: com.p6spy.engine.spy.P6SpyDriver
    url: jdbc:p6spy:postgresql://localhost:5432/robot
    username: postgres
    password: 请填入你的数据库密码
    hikari:
      pool-name: AI-Robot-HikariCP
      auto-commit: true
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      minimum-idle: 5
      maximum-pool-size: 20
      connection-test-query: SELECT 1
      validation-timeout: 5000
  cassandra:
    contact-points: 127.0.0.1
    port: 9042
    local-datacenter: datacenter1
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: sk-请填入你的阿里云百炼API_Key
      chat:
        options:
          model: qwen-omni-turbo
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1536
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000
        table-name: t_vector_store

okhttp:
  connect-timeout: 5000
  read-timeout: 30000
  write-timeout: 15000
  max-idle-connections: 200
  keep-alive-duration: 5

searxng:
  url: http://localhost:8888/search
  count: 10

customer-service:
  file-storage-path: D:\\java_workspace\\xiaoha-ai-robot
  chunk-path: D:\\java_workspace\\xiaoha-ai-robot\\chunk
  model: deepseek-v3
  temperature: 0.0
