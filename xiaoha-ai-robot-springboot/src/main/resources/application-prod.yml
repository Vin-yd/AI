spring:
  datasource:
    driver-class-name: org.postgresql.Driver                           # 生产环境直接使用 PostgreSQL 驱动
    url: jdbc:postgresql://127.0.0.1:5432/robot                         # 后端与 PostgreSQL 容器同在一台机器
    username: ${DB_USERNAME:postgres}                                  # 通过环境变量注入
    password: ${DB_PASSWORD}                                           # 通过环境变量注入（必填）
    hikari:
      pool-name: AI-Robot-HikariCP
      auto-commit: true
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      minimum-idle: 2
      maximum-pool-size: 5
      connection-test-query: SELECT 1
      validation-timeout: 5000
  cassandra:
    contact-points: 127.0.0.1
    port: 9042
    local-datacenter: datacenter1
  ai:
    openai:
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${DASHSCOPE_API_KEY}                                    # 通过环境变量注入
      chat:
        options:
          model: qwen-omni-turbo
          temperature: 0.7
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1536
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        max-document-batch-size: 10000
        table-name: t_vector_store

okhttp:
  connect-timeout: 5000
  read-timeout: 30000
  write-timeout: 15000
  max-idle-connections: 200
  keep-alive-duration: 5

searxng:
  url: http://127.0.0.1:8888/search                                      # 后端与 SearXNG 容器同在一台机器
  count: 10

customer-service:
  file-storage-path: /data/xiaoha-ai-robot                             # 容器内 Linux 路径
  chunk-path: /data/xiaoha-ai-robot/chunk
  model: deepseek-v3
  temperature: 0.0

# Sa-Token 配置
sa-token:
  token-name: Authorization
  timeout: 2592000
  is-read-header: true
  token-prefix: "Bearer"

# 阿里云短信配置
aliyun:
  sms:
    access-key-id: ${ALIYUN_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${ALIYUN_SMS_ACCESS_KEY_SECRET:}
    sign-name: 速通互联验证码
    template-code: ${ALIYUN_SMS_TEMPLATE_CODE:}
    endpoint: dysmsapi.aliyuncs.com
