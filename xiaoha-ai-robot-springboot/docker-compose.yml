version: "3.8"

# =============================================================================
#  XiaoHa AI Robot — 依赖服务（PostgreSQL + SearXNG）
#  后端直接跑在宿主机上，Docker 只管理这两个中间件
# =============================================================================
#  启动:  docker compose up -d
#  停止:  docker compose down
#  状态:  docker compose ps
# =============================================================================

services:
  # =========================================================================
  #  PostgreSQL 17 + pgvector 向量扩展
  # =========================================================================
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    environment:
      POSTGRES_DB: robot
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD 环境变量}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  #  SearXNG 搜索引擎
  # =========================================================================
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY:-$(openssl rand -hex 32)}
    restart: unless-stopped

volumes:
  pgdata:
